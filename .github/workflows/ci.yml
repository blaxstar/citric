name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web
        working-directory: web
        run: npm ci --no-audit --no-fund && npx tsc --noEmit -p . && npm run build
      - name: vet
        run: go vet ./...
      - name: test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then go test -race ./...; else go test ./...; fi
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build slim image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: slim
          load: true
          tags: citric:ci
      # The server must come up and pass its health check with no network at
      # all: proof it needs nothing from the internet (no telemetry, no
      # update checks, no CDN).
      - name: starts with no network
        run: |
          docker run -d --name citric --network none -e CITRIC_ADMIN_USER=admin citric:ci
          for i in $(seq 1 20); do
            docker exec citric citric healthcheck && break
            sleep 1
          done
          docker exec citric citric healthcheck
          docker logs citric
